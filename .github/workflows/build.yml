on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
# jobs:
#   build:
#     runs-on: ubuntu-latest
jobs:
  # Installs dependencies and verifies the web server responds as expected.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version
      - run: npm --version
      - run: npm install
      - name: Test web server
        run: |
          node app.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep --quiet "Hello, world!"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
  # Creates and publishes the next patch-version Git tag on the main branch.
  tag:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create next patch tag
        id: version
        run: |
          set -euo pipefail

          for attempt in {1..5}; do
            git fetch --tags origin
            latest_tag=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                latest_tag="$candidate"
                break
              fi
            done < <(git tag --list --sort=-version:refname)

            version="${latest_tag#v}"
            if [[ -z "$latest_tag" ]]; then
              version="0.0.0"
            fi
            IFS=. read -r major minor patch <<< "$version"
            next_version="${major}.${minor}.$((patch + 1))"
            next_tag="$next_version"

            git tag "$next_tag" "$GITHUB_SHA"
            if git push origin "$next_tag"; then
              echo "version=$next_version" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag --delete "$next_tag"
            git fetch --tags origin
            if git show-ref --verify --quiet "refs/tags/$next_tag" && [[ "$(git rev-list -n 1 "$next_tag")" == "$GITHUB_SHA" ]]; then
              echo "version=$next_version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$attempt"
          done

          echo "Unable to create a unique patch tag after 5 attempts." >&2
          exit 1
  # Builds and publishes the container image to GHCR when the event is eligible.
  publish:
    runs-on: ubuntu-latest
    needs: [build, tag]
    if: always() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'pull_request')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag is on main
        id: main-check
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || steps.main-check.outputs.on_main == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ needs.tag.outputs.version }},enable=${{ needs.tag.outputs.version != '' }}
            type=semver,pattern={{version}},enable=${{ steps.main-check.outputs.on_main == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.main-check.outputs.on_main == 'true' }}
      - name: Build and publish image
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || steps.main-check.outputs.on_main == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}